name: Build Social Cards

on:
  push:
    branches: [main]
    paths:
      - "assets/social/*.svg"
      - ".github/workflows/build-social-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-social-cards
  cancel-in-progress: true

jobs:
  # Render every current SVG source in assets/social.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Render 1200x630 PNG cards
        run: |
          set -euo pipefail
          for svg in assets/social/*.svg; do
            png="${svg%.svg}.png"
            rsvg-convert --width 1200 --height 630 --format png --output "$png" "$svg"
            echo "Rendered $png"
          done

      - name: Commit rendered cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/*.png
          if git diff --cached --quiet; then
            echo "No rendered card changes."
            exit 0
          fi
          git commit -m "Render social preview cards"
          git pull --rebase origin main
          git push origin HEAD:main
