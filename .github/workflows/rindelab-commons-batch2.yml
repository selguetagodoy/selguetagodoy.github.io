name: RINDELAB · segunda búsqueda masiva Commons

on:
  push:
    branches:
      - feat/rindelab-commons-mass-batch2-20261122
    paths:
      - scripts/import-rindelab-commons-mass-batch2.py
      - .github/workflows/rindelab-commons-batch2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rama de trabajo
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar buscador
        run: python -m py_compile scripts/import-rindelab-commons-mass-batch2.py
      - name: Buscar todas las familias todavía sin fotografía
        env:
          MAX_COMMONS_SEARCH: '254'
          MAX_COMMONS_IMPORT: '105'
        run: python -u scripts/import-rindelab-commons-mass-batch2.py
      - name: Regenerar cobertura comercial
        run: node scripts/rindelab-market-queue.cjs --write
      - name: Persistir imágenes documentadas y cobertura
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rindelab/v2-photos.js rindelab/images/commons/ rindelab/data/commons-mass-batch2-20261122.json rindelab/data/catalog-coverage-20261122.json rindelab/sii/LOTE-PENDIENTES-100-20261122.md rindelab/index.html rindelab/cotizador.html rindelab/electromovilidad.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat(rindelab): incorporar segundo barrido adicional de fotos Commons"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verificar imágenes, licencias, hashes y recuentos
        run: |
          node --check rindelab/v2-photos.js
          node rindelab/tests/commons-mass-batch2.cjs
          node rindelab/tests/commons-mass.cjs
          node rindelab/tests/carimages-rights-import.cjs
          node rindelab/tests/photos-november.cjs
          node rindelab/tests/photos-november-batch2.cjs
          node rindelab/tests/photo-integrity.cjs
          node scripts/rindelab-market-queue.cjs --check
