name: RINDELAB · curaduría editorial de Commons

on:
  push:
    branches:
      - feat/rindelab-commons-mass-20261122
    paths:
      - .github/workflows/rindelab-commons-curation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Excluir fotos de generación o carrocería no acreditada
        run: python -u scripts/curate-rindelab-commons-mass.py
      - name: Recalcular grupos comerciales sin foto
        run: node scripts/rindelab-market-queue.cjs --write
      - name: Auditoría final de 2026, Commons y CarImages
        run: |
          node --check rindelab/v2-photos.js
          node rindelab/tests/commons-mass.cjs
          node rindelab/tests/carimages-rights-import.cjs
          node rindelab/tests/photos-november.cjs
          node rindelab/tests/photos-november-batch2.cjs
          node rindelab/tests/photo-integrity.cjs
          node scripts/rindelab-market-queue.cjs --check
      - name: Guardar exclusiones y fotos definitivas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A rindelab/v2-photos.js rindelab/images/commons rindelab/data/commons-mass-20261122.json rindelab/data/catalog-coverage-20261122.json rindelab/sii/LOTE-PENDIENTES-100-20261122.md
          git diff --cached --check
          git commit -m "fix(rindelab): descartar 7 fotografías ambiguas y actualizar cobertura"
          git push origin "HEAD:$GITHUB_REF_NAME"
