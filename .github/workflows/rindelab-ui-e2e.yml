name: RINDELAB UI V2 QA

on:
  pull_request:
    paths:
      - "rindelab/**"
      - ".github/workflows/rindelab-ui-e2e.yml"
      - "scripts/audit-price-sources.cjs"
      - "scripts/rindelab-price-queue.cjs"
      - "scripts/audit-commercial-3cv-coverage.cjs"
      - "scripts/audit-commercial-versions.cjs"
      - "scripts/audit-homologation-register.cjs"
      - "scripts/audit-mtt-september-coverage.cjs"
      - "scripts/audit-mtt-discrepancy-review.cjs"
      - "scripts/audit-official-api-october-2026.cjs"
  push:
    branches:
      - "main"
    paths:
      - "rindelab/**"
      - ".github/workflows/rindelab-ui-e2e.yml"
      - "scripts/audit-price-sources.cjs"
      - "scripts/rindelab-price-queue.cjs"
      - "scripts/audit-commercial-3cv-coverage.cjs"
      - "scripts/audit-commercial-versions.cjs"
      - "scripts/audit-homologation-register.cjs"
      - "scripts/audit-mtt-september-coverage.cjs"
      - "scripts/audit-mtt-discrepancy-review.cjs"
      - "scripts/audit-official-api-october-2026.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar sintaxis JavaScript de todos los módulos de RINDELAB
        run: |
          for file in \
            rindelab/v6.js \
            rindelab/sii/prices.js \
            rindelab/cotizador.js \
            rindelab/electromovilidad.js \
            rindelab/coverage.js \
            rindelab/versiones.js \
            rindelab/sii/coverage-matcher.js \
            rindelab/sii/version-audit.js \
            scripts/audit-price-sources.cjs \
            rindelab/tests/e2e.cjs; do
            node --check "$file"
          done

      - name: Validar identidad comercial, vigencia y fotografías
        run: node rindelab/tests/catalog-identity.cjs

      - name: Verificar conciliación conservadora y 224 fotografías locales
        run: |
          node scripts/reconcile-commercial-names.cjs --check
          node scripts/report-network-reconciliation.cjs --check

      - name: Verificar ampliación de concesionarias y licencias fotográficas
        run: |
          node scripts/tests/rindelab-dealer-expansion.test.cjs
          node scripts/report-dealer-expansion.cjs --check
          node --check rindelab/v2-photos.js

      - name: Verificar cola comercial y fotografía del catálogo nacional
        run: |
          node --check rindelab/market-catalog.js
          node --check scripts/rindelab-market-queue.cjs
          node scripts/rindelab-market-queue.cjs --check

      - name: Validar integridad y exportación del informe de precios
        run: |
          node scripts/audit-price-sources.cjs --report-json=price-audit.json
          node -e "const r=require('./price-audit.json');if(r.schemaVersion!==1 || r.catalog.records<185 || r.catalog.brands<10 || !Array.isArray(r.staleRecords) || !Array.isArray(r.catalog.byBrand) || r.errors.length){process.exit(1)}"

      - name: Validar bandeja maestra de electromovilidad e importación en seco
        run: |
          node scripts/rindelab-price-queue.cjs --check
          node scripts/rindelab-price-queue.cjs --dry-run
          node scripts/tests/rindelab-price-queue.test.cjs

      - name: Auditar cruce comercial con familias 3CV y exclusiones
        run: node scripts/audit-commercial-3cv-coverage.cjs --json=coverage-audit.json

      - name: Auditar atributos técnicos y contradicciones por versión
        run: node scripts/audit-commercial-versions.cjs --json=versions-audit.json --priority-json=priority-review.json --priority-md=priority-review.md

      - name: Validar registro documental MTT y bloquear homologaciones no acreditadas
        run: node scripts/audit-homologation-register.cjs --json=homologation-ledger-audit.json

      - name: Auditar cruce completo nómina MTT septiembre y 3CV mayo
        run: node scripts/audit-mtt-september-coverage.cjs --json=mtt-september-cross-audit.json

      - name: Auditar fuentes primarias de 12 discrepancias sin rectificaciones ficticias
        run: node scripts/audit-mtt-discrepancy-review.cjs --json=mtt-discrepancies-audit.json

      - name: Validar integración exhaustiva API oficial octubre, ciclos y 228 MTT reconciliados
        run: node scripts/audit-official-api-october-2026.cjs --json=official-api-october-audit.json

      - name: Guardar expediente auditable de 28 revisiones
        uses: actions/upload-artifact@v4
        with:
          name: rindelab-qa-3cv-prioridades
          path: |
            versions-audit.json
            priority-review.json
            priority-review.md
            homologation-ledger-audit.json
            mtt-september-cross-audit.json
            mtt-discrepancies-audit.json
            official-api-october-audit.json
          retention-days: 90

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          # Ubuntu 24.04 trae repositorios Microsoft ajenos a Chromium.
          # Si responden 403, bloquean apt y con ello toda la suite.
          # Desactivar sólo la lista de paquetes Microsoft, sin alterar fuentes Ubuntu.
          for src in /etc/apt/sources.list.d/*; do
            if [ -f "$src" ] && grep -q 'packages.microsoft.com/ubuntu/24.04/prod' "$src"; then
              sudo mv "$src" "$src.disabled"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Launch static web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/rindelab-http.log 2>&1 &
          echo $! > /tmp/rindelab-http.pid
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8765/rindelab/ > /dev/null && break
            sleep 1
          done

      - name: Verify explicit search, cost sorting, comparison and responsive layout
        run: node rindelab/tests/e2e.cjs

      - name: Verify commercial scope and price associations
        run: node rindelab/tests/catalog-ui.cjs

      - name: Verify new dealers, prices, photos and two viewport sizes
        run: node rindelab/tests/dealer-browse.cjs

      - name: Validate observed used price references without fabricated median or SII mappings
        run: node rindelab/tests/used-market-data.cjs

      - name: Verify 29 supplemental used market sources and retained anomaly exclusions
        run: node rindelab/tests/used-supplement.cjs

      - name: Verify prices of used and discontinued cars with SII year
        run: |
          node --check rindelab/used-market.js
          node --check rindelab/usados.js
          node rindelab/tests/used-prices.cjs

      - name: Verify nationwide commercial catalog and five-model comparison
        run: node rindelab/tests/market-stages.cjs

      - name: Verify four-network reconciled catalog, licensing and responsive behavior
        run: node rindelab/tests/more-networks.cjs

      - name: Verify RINDELAB V2 design and licensed photographs
        run: |
          node rindelab/tests/v2-visual.cjs
          node rindelab/tests/v2-stage2.cjs
          node rindelab/tests/v2-claridad.cjs
          node rindelab/tests/v2-showcase.cjs
