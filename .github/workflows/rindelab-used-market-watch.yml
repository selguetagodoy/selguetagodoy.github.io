name: RINDELAB — referencias comerciales de usados
on:
  workflow_dispatch:
  schedule:
    - cron: '10 13 * * 1' # lunes 13:10 UTC; vigilancia semanal documental

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auditar cambios en las medianas observadas en AutoExplora
        run: node scripts/watch-used-market.cjs
      - name: Conservar reporte de diferencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rindelab-used-prices-weekly
          path: |
            rindelab-used-market-watch.json
            rindelab-used-market-watch.md
          retention-days: 90
          if-no-files-found: warn
      - name: Abrir revisión solo si varían cifras respaldadas
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const report=JSON.parse(fs.readFileSync('rindelab-used-market-watch.json','utf8'));
            if(!report.changes.length){
              core.info('Sin diferencias numéricas; no crear una alerta.');
              return;
            }
            const {owner,repo}=context.repo;
            const title='RINDELAB — revisar precios publicados de autos usados';
            const existing=(await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100}))
              .find(x=>!x.pull_request&&x.title===title);
            const uri='https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            const body=[
              '## Cambios observados, pendientes de revisión documental','',
              'Base de comparación: '+report.baseDate+'; revisión: '+report.runDate+'.',
              'Observaciones modificadas: '+report.changes.length+'.',
              'Avisos sin muestra suficiente o respuesta válida: '+report.failures.length+'.',
              '',
              ...report.changes.slice(0,30).map(x=>'- '+x.brandSlug+' '+x.modelSlug+' '+x.year+
                ': mediana $'+x.previous.medianClp+' → $'+x.current.medianClp+
                ', anuncios '+x.previous.sampleSize+' → '+x.current.sampleSize+
                ' · '+x.sourceUrl),
              '',
              '[Ver diferencias completas y fuentes]('+uri+')',
              '',
              '**No se actualizó la base:** verificar muestra, versión, fecha y condiciones antes de modificar cualquier referencia.'
            ].join('\n');
            if(existing)await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
            else await github.rest.issues.create({owner,repo,title,body});
