name: Site QA

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "scripts/*.mjs"
      - "search-index.json"
      - "*.md"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "datasets.json"
      - "research.jsonld"
      - "assets/**"
      - "scripts/site_qa.py"
      - ".github/workflows/site-qa.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "scripts/*.mjs"
      - "search-index.json"
      - ".github/workflows/site-qa.yml"
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seg-site-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check application JavaScript
        run: |
          node --check dashboard-data-centers-2026.js
          node --check site-nav.js
          node --check site-search.js
          node --check scripts/build-search-index.mjs

      - name: Validate local site
        if: github.event_name != 'schedule'
        run: |
          set -o pipefail
          python scripts/site_qa.py | tee site-qa-report.txt

      - name: Validate site and external links
        if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          python scripts/site_qa.py --external | tee site-qa-report.txt

      - name: Publish summary
        if: always()
        run: |
          echo "## Site QA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f site-qa-report.txt ]; then
            cat site-qa-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "El chequeo no alcanzó a generar reporte; revisar logs." >> "$GITHUB_STEP_SUMMARY"
          fi
